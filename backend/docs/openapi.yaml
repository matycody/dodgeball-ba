openapi: 3.0.3
info:
  title: Dodgeball BA — API REST
  version: 5.0.0 (Sprint 5)
  description: 'API del backend (Express + Prisma + Supabase Auth). Autenticación: header `Authorization: Bearer <access_token
    de Supabase>`, o `POST /auth/login`. Los eventos en tiempo real (Socket.IO, prefijo `match:`) se documentan en la Documentación
    técnica. Generado el 24/11/2026 a partir de backend/src/routes y server.js. Limitación: las respuestas no están tipadas
    y los campos de body/query se extraen del código, sin tipos ni obligatoriedad.'
servers:
- url: http://localhost:3001
  description: Local
- url: https://dodgeball-ba.onrender.com
  description: Producción (Render)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT (Supabase)
tags:
- name: Acceso
- name: Mi cuenta
- name: Perfiles
- name: Equipos
- name: Jugadores
- name: Torneos
- name: Fixture
- name: Llaves (playoffs)
- name: Estadísticas
- name: Búsqueda
- name: Partidos
- name: Planillas
- name: Sedes
- name: Noticias
- name: Sanciones
- name: Auditoría
- name: Usuarios
- name: Solicitudes de jugador
- name: Favoritos
- name: Prode
- name: Fotos y escudos
- name: Reportes de problemas
- name: Sistema
paths:
  /auth/login:
    post:
      tags:
      - Acceso
      summary: Inicio de sesión con usuario (o mail) + contraseña. El mail del usuario nunca sale del servidor.
      description: 'Acceso: Pública.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier: {}
                password: {}
      responses:
        '200':
          description: OK
  /me:
    get:
      tags:
      - Mi cuenta
      summary: (sin descripción en el código)
      description: 'Acceso: Cuenta.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
    delete:
      tags:
      - Mi cuenta
      summary: 'Eliminar mi cuenta: borra datos personales y favoritos; si estaba vinculada, solo se desvincula del perfil
        y el historial deportivo se conserva.'
      description: 'Acceso: Cuenta.'
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm: {}
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
  /me/username:
    patch:
      tags:
      - Mi cuenta
      summary: (sin descripción en el código)
      description: 'Acceso: Cuenta.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
  /me/assignments:
    get:
      tags:
      - Mi cuenta
      summary: (sin descripción en el código)
      description: 'Acceso: Cuenta.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
  /me/stats:
    get:
      tags:
      - Mi cuenta
      summary: (sin descripción en el código)
      description: 'Acceso: Cuenta.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
  /me/profile:
    get:
      tags:
      - Mi cuenta
      summary: (sin descripción en el código)
      description: 'Acceso: Cuenta.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
    patch:
      tags:
      - Mi cuenta
      summary: Edita apodo, número, fecha de nacimiento y qué datos son públicos. Todo opcional; null borra el valor.
      description: 'Acceso: Cuenta.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
  /profiles:
    post:
      tags:
      - Perfiles
      summary: Alta manual. Si el DNI ya existe, actualiza el perfil en vez de duplicarlo.
      description: 'Acceso: Admin.'
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dni: {}
                email: {}
                isPlayer: {}
                isReferee: {}
                name: {}
                sex: {}
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
    get:
      tags:
      - Perfiles
      summary: 'Listado con filtros: ?status=PENDIENTE_VINCULACION&active=true&q=texto'
      description: 'Acceso: Admin.'
      parameters:
      - name: active
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
  /profiles/{id}:
    patch:
      tags:
      - Perfiles
      summary: 'Editar (también baja/reactivación con { active: false | true })'
      description: 'Acceso: Admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                active: {}
                dni: {}
                email: {}
                isPlayer: {}
                isReferee: {}
                name: {}
                sex: {}
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
    delete:
      tags:
      - Perfiles
      summary: 'Baja lógica: sale de los planteles y conserva el historial. ?permanent=true la borra del todo (solo si no
        tiene cuenta vinculada ni partidos asignados).'
      description: 'Acceso: Admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: permanent
        in: query
        required: false
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
    get:
      tags:
      - Perfiles
      summary: Detalle de un perfil (admin), con sus equipos actuales
      description: 'Acceso: Admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
  /profiles/{id}/unlink:
    post:
      tags:
      - Perfiles
      summary: Desvincular cuenta (perdió acceso al mail). Exige el mail nuevo para que no se revincule solo.
      description: 'Acceso: Admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: {}
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
  /teams:
    post:
      tags:
      - Equipos
      summary: Crear equipo
      description: 'Acceso: Admin.'
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                branches: {}
                logo: {}
                modalities: {}
                name: {}
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
    get:
      tags:
      - Equipos
      summary: Listado (público)
      description: 'Acceso: Pública.'
      responses:
        '200':
          description: OK
  /teams/{id}:
    get:
      tags:
      - Equipos
      summary: 'Detalle con plantel activo (público: solo nombre, sin DNI ni mail; la foto solo con sesión y si el jugador
        la hizo pública)'
      description: 'Acceso: Opcional.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
    patch:
      tags:
      - Equipos
      summary: Editar nombre, logo y ramas
      description: 'Acceso: Admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                branches: {}
                foundedYear: {}
                logo: {}
                modalities: {}
                name: {}
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
    delete:
      tags:
      - Equipos
      summary: 'Eliminar equipo: solo si no tiene partidos (no se borra historial)'
      description: 'Acceso: Admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
  /teams/{id}/posiciones:
    get:
      tags:
      - Equipos
      summary: (sin descripción en el código)
      description: 'Acceso: Pública.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /teams/{id}/players:
    post:
      tags:
      - Equipos
      summary: 'Asignar jugador a un equipo en una rama (si ya tenía otro en esa rama: traspaso)'
      description: 'Acceso: Admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                branch: {}
                profileId: {}
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
  /teams/{id}/players/{profileId}:
    delete:
      tags:
      - Equipos
      summary: 'Sacar jugador del equipo en una rama: DELETE /teams/:id/players/:profileId?branch=MIXED'
      description: 'Acceso: Admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: profileId
        in: path
        required: true
        schema:
          type: string
      - name: branch
        in: query
        required: false
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
  /teams/{id}/coach:
    put:
      tags:
      - Equipos
      summary: 'Designar (profileId) o quitar (profileId: null) al DT del equipo. Uno solo por equipo; es solo una marca visual.'
      description: 'Acceso: Admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                profileId: {}
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
  /players/{id}:
    get:
      tags:
      - Jugadores
      summary: (sin descripción en el código)
      description: 'Acceso: Pública.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /tournaments:
    post:
      tags:
      - Torneos
      summary: (sin descripción en el código)
      description: 'Acceso: Admin.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
    get:
      tags:
      - Torneos
      summary: 'Público. Filtros: year, yearFrom, yearTo, status, branch, modality, format, limit (50, máx. 200), offset'
      description: 'Acceso: Pública.'
      responses:
        '200':
          description: OK
  /tournaments/eligible-teams:
    get:
      tags:
      - Torneos
      summary: Equipos que pueden jugar un torneo de esa rama y modalidad (público) Debe ir antes de GET /:id
      description: 'Acceso: Pública.'
      parameters:
      - name: branch
        in: query
        required: false
        schema:
          type: string
      - name: modality
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
  /tournaments/{id}:
    get:
      tags:
      - Torneos
      summary: (sin descripción en el código)
      description: 'Acceso: Pública.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
    patch:
      tags:
      - Torneos
      summary: (sin descripción en el código)
      description: 'Acceso: Admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
    delete:
      tags:
      - Torneos
      summary: 'Eliminar = mandar a "Eliminados": desaparece para todos (también para la organización) y se puede restaurar.
        Sus partidos se ocultan igual que al pausar.'
      description: 'Acceso: Admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
  /tournaments/{id}/pause:
    post:
      tags:
      - Torneos
      summary: 'Pausar: el torneo y todos sus partidos (programados, habilitados, en vivo o finalizados) desaparecen para
        todos menos la organización. No se borra ni se cambia nada: reanudar lo deja exactamente como estaba.'
      description: 'Acceso: Admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
  /tournaments/{id}/resume:
    post:
      tags:
      - Torneos
      summary: 'Reanudar: vuelve a mostrar el torneo y solo los partidos que ocultó la pausa (no los que se ocultaron a mano)'
      description: 'Acceso: Admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
  /tournaments/{id}/teams:
    put:
      tags:
      - Torneos
      summary: Define los equipos del torneo (reemplaza la lista). Solo en borrador. Cada equipo debe tener habilitadas la
        rama y la modalidad del torneo.
      description: 'Acceso: Admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
  /tournaments/{id}/stages/{stageId}:
    patch:
      tags:
      - Torneos
      summary: Define la estructura del torneo (zonas o llaves) y los equipos de cada una. Reemplaza la estructura anterior.
        Solo en borrador y antes de generar partidos. Corrige nombre, fase, categoría y cupos de una zona o llave sin tocar
        fixture, partidos ni llaves (sirve con el torneo cerrado). Si el torneo es
      description: 'Acceso: Admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: stageId
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
  /tournaments/{id}/stages:
    put:
      tags:
      - Torneos
      summary: (sin descripción en el código)
      description: 'Acceso: Admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
  /tournaments/{id}/reset:
    post:
      tags:
      - Torneos
      summary: 'Solo si no tiene partidos ni finalizó (no se borra historial) Reiniciar torneo (solo para pruebas y demos):
        deja el fixture como recién creado. Conserva equipos, zonas, fechas y llaves; borra resultados, relojes, canchas y
        designaciones. Body: { clearSchedule: boolean } -> true también borra los hor'
      description: 'Acceso: Admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                clearSchedule: {}
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
  /tournaments/{id}/restore:
    post:
      tags:
      - Torneos
      summary: 'Restaurar un torneo eliminado: vuelve a verse tal cual estaba (si estaba pausado, sigue pausado)'
      description: 'Acceso: Admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
  /tournaments/{id}/purge:
    delete:
      tags:
      - Torneos
      summary: 'Borrado definitivo (solo desde "Eliminados"): borra también partidos y todo lo que cuelga de ellos'
      description: 'Acceso: Admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
  /tournaments/{id}/stages/{stageId}/penalties:
    post:
      tags:
      - Torneos
      summary: (sin descripción en el código)
      description: 'Acceso: Admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: stageId
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
  /tournaments/{id}/stages/{stageId}/penalties/{penaltyId}:
    delete:
      tags:
      - Torneos
      summary: (sin descripción en el código)
      description: 'Acceso: Admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: stageId
        in: path
        required: true
        schema:
          type: string
      - name: penaltyId
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
  /tournaments/{id}/stages/{stageId}/fixture:
    post:
      tags:
      - Fixture
      summary: 'Sorteo del fixture todos contra todos de una zona. Body: shuffle (default true), doubleRound (ida y vuelta),
        dates (lista, una por fecha) o startDate + intervalDays (default 7). Sin fechas, las jornadas quedan sin día.'
      description: 'Acceso: Admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: stageId
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
    delete:
      tags:
      - Fixture
      summary: Elimina el fixture de una zona. Solo si ningún partido fue habilitado, jugado ni tiene asignaciones.
      description: 'Acceso: Admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: stageId
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
  /tournaments/{id}/stages/{stageId}/matchdays:
    post:
      tags:
      - Fixture
      summary: 'Armado a mano: agrega una fecha vacía al final de una zona de liga (con su día, opcional). Después los partidos
        se agregan a la fecha (POST /matches con countsInStandings) o se mueven entre fechas (PATCH /matches/:id con matchdayId).'
      description: 'Acceso: Admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: stageId
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
  /tournaments/{id}/matchdays/{matchdayId}:
    delete:
      tags:
      - Fixture
      summary: Quita una fecha vacía (sin partidos), por ejemplo una agregada por error.
      description: 'Acceso: Admin.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: matchdayId
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Sin sesión
        '403':
          description: Sin permiso (no es organización)
    patch:
      tags:
      - Fixture
